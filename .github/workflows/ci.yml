name: Darukaa.Earth CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite (FastAPI + PostGIS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: darukaa_secret
          POSTGRES_DB: darukaa_earth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Pytest Suite
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: darukaa
          POSTGRES_PASSWORD: darukaa_secret
          POSTGRES_DB: darukaa_earth
        run: |
          cd backend
          pytest -v

  frontend-build:
    name: Frontend Code Quality & Build (React + TypeScript + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Code Formatting Check (Prettier)
        working-directory: ./frontend
        run: npm run prettier:check

      - name: Code Quality & Linting Check (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Build TypeScript Production Bundle
        working-directory: ./frontend
        run: npm run build

  deployment:
    name: Production Deployment Trigger (Vercel / Render)
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deployment Verification Notification
        run: |
          echo "🚀 All CI tests passed cleanly! Triggering deployment to Vercel/Render..."
