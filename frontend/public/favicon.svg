<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="24" fill="#0E2F25"/>
  <!-- Outer Globe Ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#34D399" stroke-width="6"/>
  <!-- Latitude Equator Line -->
  <line x1="20" y1="50" x2="80" y2="50" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
  <!-- Longitudinal Ellipse -->
  <ellipse cx="50" cy="50" rx="14" ry="30" fill="none" stroke="#34D399" stroke-width="5"/>
  <!-- Prime Meridian Line -->
  <line x1="50" y1="20" x2="50" y2="80" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
  <!-- Active Geospatial Node -->
  <circle cx="68" cy="32" r="7" fill="#F59E0B" stroke="#0E2F25" stroke-width="2"/>
</svg>
